<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Página não encontrada</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Gagalin&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="erro.css">
</head>
<body>

  <main class="error-wrapper" role="main">

    <div class="error-visual">
      <div class="error-card">
        <div class="error-code">404</div>

        <img class="error-center-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlHgJ0VNFRgPgIyCEntYmek3N2sCWydU86LBgo8GSQcg&s=10" alt="Buraco vazio" />

      </div>
    </div>

    <div class="error-text">
      <h2 class="error-title">Ops — Página não encontrada</h2>
      <p class="error-subtitle">A página que você tentou acessar não existe ou foi removida. Talvez o link esteja errado.</p>

      <div class="error-actions">
        <a class="back-btn" href="javascript:history.back()">← Voltar</a>
        <a class="home-btn" href="menu.html">Ir para a página inicial</a>
      </div>

      <span class="small-note">Se você acha que isso é um erro, entre em contato com o suporte.</span>
    </div>

  </main>
<script src="tema.js"></script>
</body>
</html>
