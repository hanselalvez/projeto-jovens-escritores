<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
 
  <div class="login-container">
    <h2>Login</h2>
    <p>Coloque suas informações para login</p>
    <form onsubmit="return redirecionarUsuario();">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" required placeholder="Digite seu usuário">

      <label for="password">Matrícula</label>
      <input type="number" id="number" name="number" required placeholder="Digite sua Matrícula">

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required placeholder="Digite sua senha">

      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    function redirecionarUsuario() {
      // Aqui você pode até checar se algo foi digitado, mas nada seguro
      window.location.href = "index.html";
      return false; // Impede envio real do formulário
    }
  </script>

  
</body>
</html>
