<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="rainbow-bar"></div>

  <div class="login-container">
    <h2>Login</h2>
    <p>Preencha suas informações para entrar</p>

    <form onsubmit="return redirecionarUsuario();">

      <label for="username">Nome</label>
      <input type="text" id="username" name="username" required placeholder="Digite seu nome">

      <label for="pseudo">Pseudônimo (opcional)</label>
      <input type="text" id="pseudo" name="pseudo" placeholder="Digite seu pseudônimo">

      <label for="matricula">Matrícula</label>
      <input type="number" id="matricula" name="matricula" required placeholder="Digite sua matrícula">

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required placeholder="Digite sua senha">

      <button type="submit">Entrar</button>
    </form>
  </div>


  <script>
    function redirecionarUsuario() {
      const nome = document.getElementById("username").value;
      const pseudo = document.getElementById("pseudo").value;

      // Salva os dados no localStorage para a próxima página
      localStorage.setItem("nomeUsuario", nome);
      localStorage.setItem("pseudonimoUsuario", pseudo);

      window.location.href = "bemvindos.html";
      return false;
    }
  </script>

</body>
</html>
