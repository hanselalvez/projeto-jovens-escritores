<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Publicar História</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Gagalin&display=swap" rel="stylesheet">
  <!-- Seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <h1>Escritores IFRN</h1>
  <ul>
    <li><a href="inicio.html">Início</a></li>
    <li><a href="catalogo.html">Catálogo</a></li>
    <li><a href="autores.html">Autores</a></li>
  </ul>
  <ul>
    <li class="btn"><a href="#">Login</a></li>
  </ul>
</nav>

<section class="main">
  <div class="login-container" style="max-width: 800px;">
    <h2>Publicar História</h2>

    <form onsubmit="handleSubmit(event)">

      <label>Título</label>
      <input required>

      <label>Autor</label>
      <input required>

      <label>Status da Obra</label>
      <select id="status" onchange="toggleChapters()" required>
        <option value="">Selecione</option>
        <option value="one">One-shot</option>
        <option value="multi">Em andamento / Concluída</option>
      </select>

      <label>Gêneros</label>
      <select multiple>
        <option>Fantasia</option>
        <option>Aventura</option>
        <option>Drama</option>
        <option>Romance</option>
        <option>Terror</option>
        <option>Suspense</option>
        <option>Ficção Científica</option>
      </select>

      <label>Tags</label>
      <input placeholder="ex: magia, caos, lgbtqia+, deuses">

      <label>Sinopse</label>
      <textarea maxlength="500"></textarea>

      <!-- EDITOR -->
      <label>Texto</label>

      <div class="flex-wrap" style="margin-bottom: 8px;">
        <button type="button" class="btn-action" onclick="formatText('bold')">Negrito</button>
      </div>

      <div id="editor"
           contenteditable="true"
           style="
             min-height: 200px;
             background: #dbe7fa;
             border-radius: 6px;
             padding: 12px;
             color: #001933;
           ">
      </div>

      <!-- CAPÍTULOS -->
      <div id="chapters" style="display:none; margin-top: 20px;">

        <h3>Capítulos</h3>

        <div id="chaptersContainer"></div>

        <button type="button" class="btn-action" onclick="addChapter()">
          + Adicionar Capítulo
        </button>
      </div>

      <button type="submit">Publicar</button>
    </form>
  </div>
</section>

<script>
  function formatText(command) {
    document.execCommand(command, false, null);
  }

  function toggleChapters() {
    const status = document.getElementById('status').value;
    const chapters = document.getElementById('chapters');
    const editor = document.getElementById('editor');

    if (status === 'multi') {
      chapters.style.display = 'block';
      editor.style.display = 'none';
    } else {
      chapters.style.display = 'none';
      editor.style.display = 'block';
    }
  }

  function addChapter() {
    const container = document.getElementById('chaptersContainer');
    const index = container.children.length + 1;

    const chapter = document.createElement('div');
    chapter.className = 'publication';

    chapter.innerHTML = `
      <label>Capítulo ${index} – Título</label>
      <input>

      <div class="flex-wrap" style="margin: 6px 0;">
        <button type="button" class="btn-action" onclick="formatText('bold')">
          Negrito
        </button>
      </div>

      <div contenteditable="true"
           style="
             min-height: 150px;
             background: #dbe7fa;
             border-radius: 6px;
             padding: 10px;
             color: #001933;
           ">
      </div>
    `;

    container.appendChild(chapter);
  }

  function handleSubmit(e) {
    e.preventDefault();
    alert("História enviada. Agora ela entra no limbo da revisão.");
  }
</script>

</body>
</html>
