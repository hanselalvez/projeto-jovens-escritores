<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar História</title>

  <link href="https://fonts.googleapis.com/css2?family=Gagalin&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <h2>Envie sua História</h2>

    <form>
      <label>Título da História</label>
      <input type="text" required placeholder="Digite o título">

      <label>Capa da História</label>
      <input type="file" accept="image/*" required>

      <label>Arquivo PDF</label>
      <input type="file" accept="application/pdf" required>

      <button>Enviar</button>
    </form>
  </div>

</body>
</html>
